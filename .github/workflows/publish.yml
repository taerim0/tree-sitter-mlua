name: Publish package

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  # npm/crates publishing (package-npm.yml / package-crates.yml, needing
  # NPM_TOKEN / CARGO_TOKEN secrets) are deliberately left out for now --
  # Ziplex only needs the Python binding. Re-add them the same shape as
  # `pypi` below once those registries are actually wanted.
  pypi:
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_TOKEN}}
