name: Publish package

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

# npm/crates publishing (package-npm.yml / package-crates.yml, needing
# NPM_TOKEN / CARGO_TOKEN secrets) are deliberately left out for now --
# Ziplex only needs the Python binding. Re-add them (as calls to
# tree-sitter/workflows' reusable workflows, same shape as the old `pypi`
# job this replaced) once those registries are actually wanted.
#
# This job is a trimmed, local copy of tree-sitter/workflows'
# package-pypi.yml rather than a call to it -- that reusable workflow only
# supports classic PyPI API-token auth (its own `permissions: id-token:
# write` block is commented out), but PyPI now requires a *trusted
# publisher* (OIDC) to be registered before a brand-new project's first
# upload, with no "whole account" API token option available at that
# point. Trusted publishing needs `id-token: write` and the publish step to
# omit `password:` entirely -- the one thing the upstream reusable workflow
# can't do. Also skips that workflow's optional `tree-sitter generate`
# step: our grammar.js can't be regenerated by tree-sitter-cli under Node's
# ESM loader while package.json has `"type": "module"` (a real, reproduced
# error -- "module is not defined in ES module scope"), so CI builds
# straight from the already-committed, already-validated src/parser.c
# instead of trying to regenerate it.
jobs:
  build_sdist:
    name: Build source dist
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --upgrade pip build setuptools wheel
      - name: Build sources
        run: python -mbuild -n -s
      - name: Upload sources
        uses: actions/upload-artifact@v7
        with:
          name: dist-sources
          path: dist/*.tar.gz
          retention-days: 2

  build_wheels:
    name: Build wheels on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          name: dist-wheels-${{matrix.os}}
          retention-days: 2

  pypi:
    name: Publish Python package
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-mlua/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Check build artifacts
        run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
