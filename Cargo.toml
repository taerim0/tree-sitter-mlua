[package]
name = "tree-sitter-mlua"
description = "MapleStory Worlds .mlua grammar for tree-sitter"
version = "0.1.0"
authors = ["taerim0", "Munif Tanjim <hello@muniftanjim.dev>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "mlua"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/taerim0/tree-sitter-mlua"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.3"
